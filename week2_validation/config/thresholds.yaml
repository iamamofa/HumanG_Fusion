# Week 2: Data Integrity & Statistical Validation — Statistical Thresholds
# Locked BEFORE any real data analysis
#
# These thresholds define applicability and decision rules only.
# They are not tuned post hoc and are independent of observed results.

# -------------------------------
# General rules
# -------------------------------
# Set to true for testing with sample/reference data.
# Set to false for production runs with real fusion datasets.
demo_mode: false

dataset_frozen_required: true
# These flags were initially set to false during threshold pre-registration.
# They are now set to true because data analysis has been approved.
# In production (demo_mode: false), set to false to disallow analysis/plots until approved.
allow_real_data_analysis: true

# -------------------------------
# Sample size requirements
# -------------------------------
minimum_sample_size:
  benford: 100            # minimum N for Benford applicability
  distribution_tests: 50  # minimum N for KS / Anderson–Darling applicability

# -------------------------------
# Benford's Law settings
# -------------------------------
benford:
  enabled: true
  first_significant_digit_only: true
  goodness_of_fit_test: chi_squared
  significance_level: 0.05

  # IMPORTANT:
  # Benford non-compliance does NOT imply data fabrication or fraud.
  # It indicates that the dataset may not meet the assumptions under
  # which Benford’s Law is expected to apply.
  interpretation_note: "Non-compliance reflects statistical inapplicability, not data misconduct."

  decision_labels:
    pass: "Benford-consistent"
    fail: "Benford-inconsistent"
    inconclusive: "Benford-not-applicable"

# -------------------------------
# Simulation & reproducibility
# -------------------------------
simulation:
  random_seed_policy: "fixed"
  default_seed: 42
  note: "Fixed seed used for control simulations to ensure reproducibility; real data analyses do not rely on randomness."

# -------------------------------
# Distribution testing
# -------------------------------
distribution_tests:
  ks_test:
    enabled: true
    significance_level: 0.05
  anderson_darling:
    enabled: true
    significance_level: 0.05

  # NOTE:
  # Distribution tests are diagnostic tools to assess suitability
  # for downstream modeling. They are not decisive evidence for or
  # against any specific generative model.
  interpretation_note: "Diagnostic only; results do not imply model truth."

# -------------------------------
# Visualization rules
# -------------------------------
# save_real_data_plots was false during pre-registration; now true (analysis approved).
# dpi 300 for publication-quality figures.
visualization:
  allow_log_scale: true
  allow_linear_scale: true
  save_real_data_plots: true
  dpi: 300

# -------------------------------
# COSMIC cross-validation
# -------------------------------
cosmic:
  enabled: true
  require_exact_gene_match: true
  allow_partial_matches: false
  save_results_before_freeze: false

# -------------------------------
# Reporting rules
# -------------------------------
reporting:
  allow_interpretation_before_freeze: false
  allow_dataset_approval_before_freeze: false
